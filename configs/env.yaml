# RL environment + cost model. Spec §11, build step 4b (Phase B).
#
# Decisions behind these numbers are in DECISIONS.md D-034 .. D-036. Nothing here
# is tuned on any split: they are fixed design choices, and the cost sensitivity
# grid (spec §11: 0/5/10/20 bps) is how their effect is reported.
universe: B                   # the allocation universe (spec §3.2); assets = data.allocatable[B] + cash

action:
  # action in [-1, 1]^(n+1) -> logits = logit_scale * action -> softmax over the
  # risky lines and cash -> Euclidean projection onto the constraint set
  # (D-001: enforced by projection, not by penalty). The all-zero action is the
  # equal-weight portfolio over the n+1 lines.
  logit_scale: 3.0

costs:
  # D-034. Per SIDE on each risky leg's traded notional: |dw_i| * (per_side_bps
  # + slippage_vol_coef * trailing daily vol_i). Cash trades are free.
  per_side_bps: 5.0
  slippage_vol_coef: 0.02     # 2 bps of slippage per 1% of trailing daily vol
  vol_window: 20              # sessions of trailing daily return std, causal
  # Sensitivity scales BOTH terms by bps / per_side_bps, so 0 is frictionless.
  sensitivity_bps: [0, 5, 10, 20]

reward:
  name: log_return_net        # log_return_net | dsr | mv_penalty | drawdown_penalty
  # Non-default reward variants are experimental factors, not tuned defaults.
  mv_lambda: 1.0              # reward = log net return - lambda * realised in-period variance
  drawdown_lambda: 0.02       # reward = log net return - lambda * running drawdown (fraction of peak)
  dsr_eta: 0.05               # adaptation rate of the differential Sharpe ratio moments

episode:
  # Training: random start inside the split, this many decisions long (~2 years
  # of weekly decisions). Evaluation: one fixed episode over the whole split.
  train_length_decisions: 104
  start_weights: cash         # the portfolio starts in cash; initiation is a trade
