# HMM configuration. Spec §8. Implemented in Step 2 — this file is the
# contract the Step 2 code must satisfy, and is validated by config.py now.

# Observations MUST be low-autocorrelation. Rolling statistics such as
# spy_vol_20 are FORBIDDEN here: feeding one was defect B3, which violated
# conditional independence, saturated the posteriors and collapsed the states
# into a volatility ladder. The blocklist is enforced in config validation.
observation_blocklist_substrings: ["vol_20", "vol_60", "mom_20", "mom_60", "corr_60", "skew_60", "kurt_60"]

specifications:
  H1:                         # univariate — volatility structure must emerge
    observations: ["SPY_return_1d"]
  H2:                         # multivariate — changes only, all stationary.
    # RETAINED FOR THE HISTORICAL K-SWEEP RECORD ONLY (D-024): H2 is no
    # longer selectable by `fit.specification` and is not walk-forwarded.
    # Every K in its own sweep produced a degenerate best restart (expected
    # state duration ~1-2 days against a 5-day floor), and even setting that
    # aside, its val_loglik was never comparable to H1's (different
    # observation dimensionality). See DECISIONS.md D-024.
    #
    # Spec §8.2 lists credit_proxy_change among H2's observations. It cannot
    # be used: credit_proxy derives from HYG/LQD, which are Universe-B-only
    # tickers (§3.1), and the HMM fits on Universe A throughout — fit_early
    # (§3.2) AND every walk-forward refit, since a single GaussianHMM's
    # observation dimensionality cannot change mid-series. Including it would
    # either violate Universe A's structural isolation (enforced and tested
    # in build.py / test_fit_scope.py) or silently restrict the whole walk-
    # forward chain to post-2007 dates, defeating §3.2's reason for fitting
    # on A in the first place: the dot-com crisis. Dropped, not substituted —
    # unlike the curve slope (D-004) or VIX3M (D-005), there is no Universe
    # A-available proxy for credit spread. See DECISIONS.md D-016.
    observations:
      - "SPY_return_1d"
      - "vix_change"
      - "curve_change"
      - "avg_pairwise_corr_change"

fit:
  universe: A                 # spec §3.2
  # Spec §8.2 amendment, D-024: comparing val_loglik across H1 (1 observation
  # dim) and H2 (4 dims) is invalid — a multivariate Gaussian density sits on
  # a structurally different scale than a univariate one on the same data, so
  # the higher-dimensional spec wins regardless of regime quality. There is
  # therefore no automatic cross-spec selection: this pins the one spec that
  # is actually fit and walk-forwarded. H2 is kept under `specifications`
  # below for the historical K-sweep record only, not for comparison.
  specification: "H1"
  covariance_type: "full"
  k_range: [2, 3, 4, 5, 6, 7, 8]
  n_restarts: 20              # spec §8.4 — report the whole LL distribution
  n_iter: 1000
  tol: 1.0e-4

selection:
  # Spec §8.4: validation log-likelihood is PRIMARY; BIC/AIC are secondary.
  primary: "val_loglik"
  secondary: ["bic", "aic"]
  # Degenerate-solution rejection (spec §8.4).
  min_expected_duration_days: 5
  min_unconditional_prob: 0.02
  # D-025: a K whose best restart is degenerate is discarded outright, not
  # merely deprioritised; among the survivors, a val_loglik gap smaller than
  # this many points from the best is a near-tie, broken by BIC.
  near_tie_margin: 2.0

labeling:
  # Spec §8.5. Names are derived from position after sorting, NEVER hard-coded.
  sort_by: "state_return_std"
  ascending: true

walkforward:
  scheme: "expanding"         # spec §6.2 — never a fixed 5-year window
  refit_cadence: "monthly"
  carry_filter_state: true    # spec §8.6 — do not restart from startprob_
  # K is already selected (fit.n_restarts >= 20 governs THAT sweep); §8.6
  # does not itself require 20+ restarts per monthly refit, and an expanding
  # window makes most folds' fit window hundreds to thousands of sessions
  # long, which is far less prone to a bad EM local optimum than a short
  # fixed window. A smaller, separate budget keeps ~200 monthly refits over
  # 17 years computationally tractable (hours, not days) without weakening
  # the one restart count the spec actually pins a number to.
  n_restarts: 5
  # D-026: if more than this fraction of walk-forward folds come back with
  # EVERY restart degenerate, that spec/K pair is not producing usable
  # regimes often enough to trust — raise rather than silently average over
  # it the way the posterior series otherwise would.
  max_degenerate_fold_fraction: 0.10

robustness:
  # Spec §3.2 required check: refit on B's train window only and compare.
  refit_on_b_train: true

evaluation:
  drawdown_bear_threshold: 0.20   # SPY >= 20% off its high
  entropy_saturation_warn: 0.05
  # How far before an episode's dated start to search for the crisis signal
  # crossing threshold (spec §8.7 detection lag). The original default of 20
  # sessions (~1 month) turned out to be a real ceiling, not a design choice:
  # on the real 2026-10-01 data both the HMM and the VIX-threshold baseline
  # crossed 0.5 well before 20 sessions ahead of both NBER episodes (as far
  # back as ~190 sessions were checked), so a 20-session margin was silently
  # reporting the search window's edge rather than the true first crossing.
  # 60 sessions (~1 quarter) is long enough to capture genuine early signal
  # without reaching so far back that "detection" becomes indistinguishable
  # from ambient noise. See DECISIONS.md D-017.
  detection_search_margin_sessions: 60
